name: Build Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true
      - name: Download libmpv (pinned shinchiro/mpv-winbuild-cmake 20260923)
        shell: pwsh
        run: |
          # Pinned: this exact build was verified to include mpv's VapourSynth filter
          # (-Dvapoursynth=enabled) and to load VSScript.dll at runtime.
          $tag="20260923"
          $asset="mpv-dev-x86_64-20260923-git-6fd80b2003.7z"
          $sha="372F29C292D0C8B4CE916225739E5872E35B8E11F3F4590C285BAED8BA551100"
          $h=@{"User-Agent"="NovaPlayer-GitHub-Actions"}
          Invoke-WebRequest -Headers $h -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$asset" -OutFile mpv-dev.7z
          $actual=(Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash
          if($actual -ne $sha){throw "libmpv SHA-256 mismatch: expected $sha got $actual"}
          New-Item -ItemType Directory -Force deps\mpv|Out-Null
          7z x mpv-dev.7z "-odeps\mpv" -y
          $c=Get-ChildItem deps\mpv -Recurse -Filter client.h|Where-Object {$_.FullName -match '[\\/]mpv[\\/]client\.h$'}|Select-Object -First 1
          $d=Get-ChildItem deps\mpv -Recurse -Filter libmpv-2.dll|Select-Object -First 1
          if(!$d){$d=Get-ChildItem deps\mpv -Recurse -Filter mpv-2.dll|Select-Object -First 1}
          if(!$c -or !$d){throw "libmpv files missing"}
          "MPV_INCLUDE_ROOT=$(Split-Path (Split-Path $c.FullName -Parent) -Parent)"|Out-File $env:GITHUB_ENV -Append
          "MPV_DLL=$($d.FullName)"|Out-File $env:GITHUB_ENV -Append
      - name: Generate import library
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\make-mpv-lib.ps1 "%MPV_DLL%"
          echo MPV_LIB=%CD%\deps\mpv-import\mpv.lib>>%GITHUB_ENV%
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMPV_INCLUDE_DIR="$env:MPV_INCLUDE_ROOT" -DMPV_LIBRARY="$env:MPV_LIB"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          mkdir portable
          Copy-Item build\Release\NovaPlayer.exe portable\
          Copy-Item "$env:MPV_DLL" portable\libmpv-2.dll
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime portable\NovaPlayer.exe
      - name: Bundle MSVC runtime DLLs (app-local, needed by Qt, VapourSynth and the RIFE plugin)
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt=Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory|Sort-Object FullName -Descending|Select-Object -First 1
          if(!$crt){throw "MSVC redistributable CRT directory not found"}
          foreach($n in 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll'){
            $p=Join-Path $crt.FullName $n
            if(Test-Path $p){Copy-Item $p portable\ -Force}
          }
          Get-ChildItem portable\*.dll|Select-Object Name,Length
      - name: Assemble RIFE / VapourSynth runtime (pinned, SHA-256 verified)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\assemble-rife-runtime.ps1 -PortableDir portable
      - name: List package
        shell: pwsh
        run: |
          Get-ChildItem portable -Recurse -File|Where-Object {$_.FullName -notmatch '\\vapoursynth\\[^\\]+      - uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-Windows-x64
          path: portable/
}|Select-Object @{n='Path';e={$_.FullName.Substring((Resolve-Path portable).Path.Length)}},Length|Format-Table -AutoSize
          "Total size: {0:N1} MB" -f ((Get-ChildItem portable -Recurse -File|Measure-Object Length -Sum).Sum/1MB)
      - name: Smoke-test packaged app startup
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path portable).Path "NovaPlayer.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "NovaPlayer exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-Windows-x64
          path: portable/
